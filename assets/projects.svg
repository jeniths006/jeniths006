<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
<defs>
<filter id="b" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="60"/></filter>
<filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity=".5"/></filter>
<radialGradient id="p"><stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/><stop offset=".6" stop-color="#7c3aed" stop-opacity=".18"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
<radialGradient id="c"><stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/><stop offset=".6" stop-color="#22d3ee" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<radialGradient id="m"><stop offset="0" stop-color="#f472b6" stop-opacity=".55"/><stop offset=".6" stop-color="#f472b6" stop-opacity=".18"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
<radialGradient id="v"><stop offset="50%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".45"/></radialGradient>
<style>
.blob{animation:d 12s ease-in-out infinite}.b2{animation-delay:-4s}.b3{animation-delay:-8s}
@keyframes d{0%,100%{transform:translate(0,0)}25%{transform:translate(35px,-25px)}50%{transform:translate(0,-45px)}75%{transform:translate(-35px,-20px)}}
.p{animation:p 3s ease-in-out infinite}.q1{animation-delay:-.6s}.q2{animation-delay:-1.2s}.q3{animation-delay:-1.8s}
@keyframes p{0%,100%{opacity:.15}50%{opacity:.32}}
text{font-family:Inter,system-ui,sans-serif}
</style></defs>
<rect width="800" height="520" fill="#0b0b12"/>
<g filter="url(#b)"><circle class="blob" cx="224" cy="286" r="220" fill="url(#p)"/><circle class="blob b2" cx="576" cy="234" r="240" fill="url(#c)"/><circle class="blob b3" cx="400" cy="536" r="200" fill="url(#m)"/></g>
<rect width="800" height="520" fill="url(#v)"/>
<g fill="#fff" class="p"><circle cx="92" cy="90" r="1.2"/><circle class="q1" cx="728" cy="112" r="1.2"/><circle class="q2" cx="414" cy="470" r="1.2"/><circle class="q3" cx="622" cy="48" r="1.2"/><circle cx="174" cy="390" r="1.2"/><circle class="q1" cx="550" cy="322" r="1.2"/><circle class="q2" cx="344" cy="72" r="1.2"/><circle class="q3" cx="690" cy="418" r="1.2"/></g>
<g filter="url(#s)"><rect x="30" y="24" width="740" height="472" rx="18" fill="rgba(255,255,255,.04)"/></g>
